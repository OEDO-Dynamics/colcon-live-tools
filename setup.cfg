[metadata]
name = colcon-live-tools
version = attr: colcon_live_tools.__version__
author = OEDO Dynamics Inc.
# TODO(公開前に置き換え): PyPI に公開すると誰でも見える連絡先になるので、
# 個人のメールアドレスをそのまま使ってよいか一度確認してから差し替えること。
author_email = TODO@example.com
description = A lightweight, terminal-native catkin_tools-style live build status board for colcon.
long_description = file: README.md
long_description_content_type = text/markdown
# TODO(公開前に置き換え): 実際のリポジトリURLに差し替える
url = https://github.com/OEDO-Dynamics/colcon-live-tools
project_urls =
    Bug Tracker = https://github.com/OEDO-Dynamics/colcon-live-tools/issues
    Source = https://github.com/OEDO-Dynamics/colcon-live-tools
license = Apache License 2.0
license_files = LICENSE
keywords = colcon ros ros2 catkin catkin_tools build-tool
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development :: Build Tools
    Topic :: Software Development :: Embedded Systems

[options]
packages = find:
zip_safe = false
python_requires = >=3.8
install_requires =
    colcon-core>=0.5.2

[options.packages.find]
exclude =
    test
    test.*

[options.entry_points]
colcon_core.event_handler =
    live_status = colcon_live_tools.event_handler.live_status:LiveStatusEventHandler
colcon_core.verb =
    lbuild = colcon_live_tools.verb.lbuild:LiveBuildVerb
    lb = colcon_live_tools.verb.lbuild:LiveBuildVerbShort
    lclean = colcon_live_tools.verb.lclean:LiveCleanVerb
    lc = colcon_live_tools.verb.lclean:LiveCleanVerbShort

[flake8]
max-line-length = 99
